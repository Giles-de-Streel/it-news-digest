name: Fetch news

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Only keep stories published in the last N hours"
        default: "36"
  # Every hour on the hour (UTC). GitHub may start scheduled runs late or skip them at busy
  # times; a Windmill job on f1fap-n8n (f/admin_platforms/it_news_digest_backup) checks at :05
  # and dispatches this workflow if no run has started since the top of the hour.
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: fetch-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch feeds
        run: python -I scripts/fetch_news.py --hours "${{ github.event.inputs.hours || '36' }}"

      - name: Commit new stories
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Day files plus the CVSS/EPSS/KEV caches; some caches only appear once a story mentions a CVE
          git add -A data
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "News for $(TZ=America/New_York date +%F)"
          # Another push may have landed in the meantime; rebase onto it
          for i in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep 5
          done
          exit 1
