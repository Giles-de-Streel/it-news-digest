<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IT News</title>
  <meta name="description" content="Daily IT and security news from multiple sources, de-duplicated and ranked by how widely each story is reported.">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="favicon.svg?v=2026102906" type="image/svg+xml">
  <link rel="icon" href="icon-192.png?v=2026102906" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icon-192.png?v=2026102906">
  <link rel="stylesheet" href="style.css?v=2026103015">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <h1 class="brand">
        <a id="home" class="brand-link" href="./" title="Back to today's news">
        <span class="brand-name">IT NEWS</span>
        <svg class="brand-icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 5a1 1 0 0 1 1-1h11a1 1 0 0 1 1 1v13a2 2 0 0 0 2 2H6a2 2 0 0 1-2-2z"/>
          <path d="M17 9h2.5a.5.5 0 0 1 .5.5V18a2 2 0 0 1-2 2"/>
          <rect x="7" y="7.5" width="4" height="4" rx=".5"/>
          <path d="M13 8h1.5M13 11h1.5M7 14.5h7.5M7 17h5"/>
        </svg>
        </a>
      </h1>
      <div class="runner-track" aria-hidden="true">
        <div class="tree">
          <svg viewBox="0 0 16 22">
            <rect class="trunk" x="6.8" y="14" width="2.4" height="8" rx=".6"/>
            <path class="leaves" d="M8 1 14 9h-2.5L15 14H1l3.5-5H2z"/>
          </svg>
        </div>
        <div class="pet">
          <svg viewBox="0 0 18 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <rect x="3" y="4.2" width="10" height="4" rx="2" fill="currentColor" stroke="none"/>
            <path class="p pet-tail" d="M3.2 5 1.2 2.2"/>
            <g class="p pet-head">
              <circle cx="14.6" cy="3.8" r="2.3" fill="currentColor" stroke="none"/>
              <path d="M16.4 4.3h1.4M13.6 1.9 13.1.5"/>
            </g>
            <g class="pet-run">
              <path class="p fl leg-1" d="M11.5 8v3.5"/>
              <path class="p fl leg-2" d="M11.5 8v3.5"/>
              <path class="p bl leg-2" d="M4.5 8v3.5"/>
              <path class="p bl leg-1" d="M4.5 8v3.5"/>
            </g>
            <path class="pet-stand" d="M11.5 8v3.5M10 8v3.5M4.5 8v3.5M6 8v3.5"/>
            <g class="pet-pee">
              <path d="M11.5 8v3.5M10 8v3.5M6 8v3.5M4.5 8 1.6 5.8"/>
              <path class="stream" d="M3.6 7.6Q.5 7.8-1.4 11.4"/>
            </g>
          </svg>
        </div>
        <div class="runner">
          <svg viewBox="0 0 20 26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="11.5" cy="4" r="2.8"/>
            <path d="M11 7.5 10 15"/>
            <g class="run-pose">
              <path class="limb arm arm-a" d="M10.8 9v5"/>
              <path class="limb arm arm-b" d="M10.8 9v5"/>
              <path class="limb leg leg-a" d="M10 15v9"/>
              <path class="limb leg leg-b" d="M10 15v9"/>
            </g>
            <g class="shake-pose">
              <g class="shake-arms"><path d="M10.8 9 19 8.5M10.8 10 19 11"/></g>
              <path d="M10 15 6.5 24M10 15l2.5 9"/>
            </g>
            <g class="wave-pose">
              <path class="limb wave-arm" d="M10.8 9 14.5 3.5"/>
              <path d="M10.8 9 9 14M10 15 8 24M10 15l2 9"/>
            </g>
            <g class="punch-pose">
              <path d="M10.8 9 13.5 12 15 9.5"/>
              <path class="jab" d="M10.8 9h8.6"/>
              <path d="M10 15 7 24M10 15l3.5 9"/>
            </g>
          </svg>
        </div>
      </div>
      <div class="controls">
        <span id="updated" class="updated"></span>
        <label class="sr" for="day">Day</label>
        <select id="day"></select>
        <nav class="tabs" role="tablist">
          <button role="tab" data-view="news" aria-selected="true">News</button>
          <button role="tab" data-view="cves" aria-selected="false">CVEs <span id="cve-tab-count" class="tab-count"></span></button>
          <button role="tab" data-view="sources" aria-selected="false">Sources</button>
        </nav>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section id="view-news" class="view news-layout">
      <nav id="topic-nav" class="topic-nav" aria-label="Topics"></nav>
      <div class="news-main">
        <div class="filters">
          <button id="topics-toggle" class="topics-toggle" type="button" aria-controls="topic-nav" aria-expanded="false">Topics</button>
          <input id="search" type="search" placeholder="Search stories and CVEs  ( / )" aria-keyshortcuts="/">
          <select id="source-filter"><option value="">All sources</option></select>
          <div class="seg" role="group" aria-label="Layout">
            <button type="button" data-layout="cards" aria-pressed="false">Cards</button>
            <button type="button" data-layout="list" aria-pressed="true">List</button>
          </div>
        </div>
        <div id="filter-head" class="filter-head" aria-live="polite" hidden></div>
        <div id="news"></div>
      </div>
    </section>

    <section id="view-cves" class="view" hidden>
      <div class="section-head page-head">
        <h2>New critical CVEs</h2>
        <span id="cves-meta" class="muted"></span>
      </div>
      <div class="filters">
        <input id="cve-search" type="search" placeholder="Search CVE IDs, products and descriptions">
      </div>
      <div id="cves-list"></div>
    </section>

    <section id="view-sources" class="view" hidden>
      <h2>Sources</h2>
      <p id="sources-meta" class="muted"></p>
      <p id="sources-switches" class="src-switches muted"></p>
      <table class="src-table">
        <thead><tr><th><span class="sr">Show</span></th><th>Source</th><th>Category</th><th>Fetched</th><th>In window</th><th>Status</th></tr></thead>
        <tbody id="sources-body"></tbody>
      </table>

      <div id="suggested" class="suggested" hidden>
        <h2>Suggested sources</h2>
        <p id="suggested-meta" class="muted"></p>
        <table class="src-table">
          <thead><tr><th>Site</th><th>Links</th><th>Linked from</th><th>Latest linked story</th><th>Feed</th></tr></thead>
          <tbody id="suggested-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="app.js?v=2026103014"></script>
</body>
</html>
