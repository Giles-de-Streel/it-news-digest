  <script>
    // Before first paint: colour mode (saved ind.theme, else the system setting) and the header animation switch
    (function () {
      var d = document.documentElement, t = "";
      try { t = JSON.parse(localStorage.getItem("ind.theme") || '""'); } catch (e) {}
      if (t !== "dark" && t !== "medium" && t !== "light") {
        t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      d.setAttribute("data-theme", t);
      // The header animation starts off; it runs only after the match has been lit (ind.scene = true)
      var lit = false;
      try { lit = localStorage.getItem("ind.scene") === "true"; } catch (e) {}
      if (!lit) d.classList.add("scene-off");
    })();
  </script>

  <main class="wrap">
    <section id="view-news" class="view news-layout">
      <nav id="topic-nav" class="topic-nav" aria-label="Topics"></nav>
      <div class="news-main">
        <div class="filters">
          <button id="topics-toggle" class="topics-toggle" type="button" aria-controls="topic-nav" aria-expanded="false">Topics</button>
          <input id="search" type="search" placeholder="Search stories and CVEs  ( / )" aria-keyshortcuts="/">
          <select id="source-filter"><option value="">All sources</option></select>
          <div class="seg" role="group" aria-label="Layout">
            <button type="button" data-layout="cards" aria-pressed="false">Cards</button>
            <button type="button" data-layout="list" aria-pressed="true">List</button>
          </div>
        </div>
        <div id="filter-head" class="filter-head" aria-live="polite" hidden></div>
        <div id="news"></div>
      </div>
    </section>

    <section id="view-cves" class="view" hidden>
      <div class="section-head page-head">
        <h2>New critical CVEs</h2>
        <span id="cves-meta" class="muted"></span>
      </div>
      <div class="filters">
        <input id="cve-search" type="search" placeholder="Search CVE IDs, products and descriptions">
      </div>
      <div id="cves-list"></div>
    </section>

    <section id="view-sources" class="view" hidden>
      <h2>Sources</h2>
      <div class="filters">
        <input id="src-search" type="search" placeholder="Search sources by name, category or site  ( / )" aria-label="Search sources" aria-keyshortcuts="/">
      </div>
      <p id="sources-meta" class="muted"></p>
      <p id="sources-switches" class="src-switches muted"></p>
      <table class="src-table">
        <thead><tr><th><span class="sr">Show</span></th><th>Source</th><th>Category</th><th>Fetched</th><th>In window</th><th>Status</th></tr></thead>
        <tbody id="sources-body"></tbody>
      </table>

      <div id="suggested" class="suggested" hidden>
        <h2>Suggested sources</h2>
        <p id="suggested-meta" class="muted"></p>
        <table class="src-table">
          <thead><tr><th>Site</th><th>Links</th><th>Linked from</th><th>Latest linked story</th><th>Feed</th><th>Add</th></tr></thead>
          <tbody id="suggested-body"></tbody>
        </table>
      </div>
    </section>

    <section id="view-history" class="view news-layout" hidden>
      <nav id="day-nav" class="day-nav" aria-label="Days"></nav>
      <div class="news-main">
        <div class="filters">
          <input id="hist-search" type="search" placeholder="Search past stories and CVEs  ( / )" aria-label="Search history" aria-keyshortcuts="/">
          <select id="hist-topic" aria-label="Topic"><option value="">All topics</option></select>
