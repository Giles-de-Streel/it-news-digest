<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IT News</title>
  <meta name="description" content="Daily IT and security news from multiple sources, de-duplicated and ranked by how widely each story is reported.">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <h1 class="brand">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
          <defs>
            <linearGradient id="logo-grad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#2563eb"/>
              <stop offset="1" stop-color="#7c3aed"/>
            </linearGradient>
          </defs>
          <rect width="32" height="32" rx="8" fill="url(#logo-grad)"/>
          <circle cx="9.5" cy="10.5" r="2.5" fill="#fff"/>
          <rect x="14.5" y="9" width="9" height="3" rx="1.5" fill="#fff"/>
          <rect x="7" y="15" width="16.5" height="3" rx="1.5" fill="#fff" opacity=".85"/>
          <rect x="7" y="21" width="11.5" height="3" rx="1.5" fill="#fff" opacity=".65"/>
        </svg>
        <span class="brand-name"><span class="brand-it">IT</span> NEWS</span>
      </h1>
      <div class="controls">
        <label class="sr" for="day">Day</label>
        <select id="day"></select>
        <nav class="tabs" role="tablist">
          <button role="tab" data-view="news" aria-selected="true">News</button>
          <button role="tab" data-view="sources" aria-selected="false">Sources</button>
        </nav>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section id="view-news" class="view">
      <div class="filters">
        <input id="search" type="search" placeholder="Search titles and summaries">
        <select id="source-filter"><option value="">All sources</option></select>
      </div>
      <div class="chips" id="topic-filter"></div>
      <div id="news"></div>
    </section>

    <section id="view-sources" class="view" hidden>
      <h2>Sources for this day</h2>
      <p id="sources-meta" class="muted"></p>
      <table class="src-table">
        <thead><tr><th>Source</th><th>Fetched</th><th>In window</th><th>Status</th></tr></thead>
        <tbody id="sources-body"></tbody>
      </table>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
